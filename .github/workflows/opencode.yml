name: opencode

on:
  issue_comment:
    types: [created]

  workflow_dispatch:
    inputs:
      prompt:
        description: "What should OpenCode do?"
        required: true
        default: "Analyze this repository"

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  opencode:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        (
          contains(github.event.comment.body, '/opencode') ||
          contains(github.event.comment.body, '/oc')
        )
      )

    runs-on: ubuntu-latest

    steps:
      - name: Show event information
        run: |
          echo "EVENT: ${{ github.event_name }}"
          echo "COMMENT: ${{ github.event.comment.body }}"

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Find obsolete OpenCode model
        run: |
          echo "=== Searching repository ==="
          if grep -R "claude-sonnet-4-20250514" . \
            --exclude-dir=.git \
            --exclude-dir=node_modules; then
            echo ""
            echo "WARNING: OLD MODEL FOUND IN REPOSITORY"
          else
            echo "Old model was NOT found in repository."
          fi

          echo ""
          echo "=== OpenCode config files ==="
          find . -maxdepth 4 \
            \( -name "opencode.json" -o -name "opencode.jsonc" \) \
            -print

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        with:
          model: anthropic/claude-sonnet-4-6
          prompt: ${{ github.event_name == 'workflow_dispatch' && inputs.prompt || github.event.comment.body }}
          use_github_token: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
