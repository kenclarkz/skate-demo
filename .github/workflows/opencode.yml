name: opencode

on:
issue_comment:
types: [created]

workflow_dispatch:
inputs:
prompt:
description: “What should OpenCode do?”
required: true
default: “Analyze this repository”

permissions:
contents: write
issues: write
pull-requests: write
id-token: write

jobs:
opencode:
runs-on: ubuntu-latest

steps:
  - name: Show event information
    run: |
      echo "Event: ${{ github.event_name }}"
      echo "Actor: ${{ github.actor }}"
      if [ "${{ github.event_name }}" = "issue_comment" ]; then
        echo "Comment: ${{ github.event.comment.body }}"
      fi
  - name: Checkout repository
    uses: actions/checkout@v6
    with:
      fetch-depth: 0
      persist-credentials: true
  - name: Configure Git identity
    run: |
      git config --global user.name "OpenCode"
      git config --global user.email "opencode@users.noreply.github.com"
  - name: Create OpenCode branch
    run: |
      if [ "${{ github.event_name }}" = "issue_comment" ]; then
        BRANCH="opencode/issue-${{ github.event.issue.number }}-${{ github.run_id }}"
      else
        BRANCH="opencode/manual-${{ github.run_id }}"
      fi
      echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
      git checkout -b "$BRANCH"
      echo "Created branch:"
      git branch --show-current
  - name: Run OpenCode
    uses: anomalyco/opencode/github@latest
    with:
      model: opencode/big-pickle
      prompt: ${{ github.event_name == 'workflow_dispatch' && inputs.prompt || github.event.comment.body }}
      use_github_token: true
    env:
      GITHUB_TOKEN: ${{ github.token }}
  - name: Check OpenCode changes
    run: |
      echo "===== GIT STATUS ====="
      git status --short
      echo "===== CHANGED FILES ====="
      git diff --name-only
      echo "===== DIFF SUMMARY ====="
      git diff --stat
  - name: Commit OpenCode changes
    id: commit
    run: |
      if [ -z "$(git status --porcelain)" ]; then
        echo "No changes were produced by OpenCode."
        echo "changed=false" >> "$GITHUB_OUTPUT"
        exit 0
      fi
      git add -A
      git commit \
        -m "OpenCode: update repository"
      echo "changed=true" >> "$GITHUB_OUTPUT"
  - name: Push OpenCode branch
    if: steps.commit.outputs.changed == 'true'
    run: |
      git push --set-upstream origin "$BRANCH"
      echo "Successfully pushed branch:"
      echo "$BRANCH"
  - name: Create Pull Request
    if: steps.commit.outputs.changed == 'true'
    env:
      GH_TOKEN: ${{ github.token }}
    run: |
      EXISTING_PR=$(gh pr list \
        --head "$BRANCH" \
        --base main \
        --json url \
        --jq '.[0].url')
      if [ -n "$EXISTING_PR" ]; then
        echo "Pull request already exists:"
        echo "$EXISTING_PR"
        exit 0
      fi
      if [ "${{ github.event_name }}" = "issue_comment" ]; then
        gh pr create \
          --base main \
          --head "$BRANCH" \
          --title "OpenCode: update issue #${{ github.event.issue.number }}" \
          --body "OpenCode implementation for issue #${{ github.event.issue.number }}."
      else
        gh pr create \
          --base main \
          --head "$BRANCH" \
          --title "OpenCode: repository update" \
          --body "OpenCode implementation generated from workflow_dispatch."
      fi
  - name: Final repository state
    run: |
      echo "===== FINAL STATUS ====="
      git status --short
      echo "===== FINAL COMMIT ====="
      git log -1 --oneline
      echo "===== CURRENT BRANCH ====="
      git branch --show-current
