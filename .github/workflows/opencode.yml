name: opencode

on:
  issue_comment:
    types: [created]

  workflow_dispatch:
    inputs:
      prompt:
        description: "What should OpenCode do?"
        required: true
        default: "Analyze this repository"

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  opencode:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        (
          contains(github.event.comment.body, '/opencode') ||
          contains(github.event.comment.body, '/oc')
        )
      )

    runs-on: ubuntu-latest

    steps:
      - name: Show event information
        run: |
          echo "EVENT: ${{ github.event_name }}"
          echo "COMMENT: ${{ github.event.comment.body }}"

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check for old OpenCode model configuration
        run: |
          echo "=== Searching repository for old model ==="
          grep -R "claude-sonnet-4-20250514" . \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            || true

          echo "=== OpenCode configuration files ==="
          find . -maxdepth 3 \
            \( -name "opencode.json" -o -name "opencode.jsonc" \) \
            -print

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        with:
          model: anthropic/claude-sonnet-4-5
          prompt: ${{ github.event_name == 'workflow_dispatch' && inputs.prompt || github.event.comment.body }}
          use_github_token: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
