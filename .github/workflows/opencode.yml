name: opencode

on:
  issue_comment:
    types: [created]

  workflow_dispatch:
    inputs:
      prompt:
        description: "What should OpenCode do?"
        required: true
        default: "Analyze this repository"

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  opencode:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        (
          contains(github.event.comment.body, '/opencode') ||
          contains(github.event.comment.body, '/oc')
        )
      )

    runs-on: ubuntu-latest

    steps:
      - name: Show event information
        run: |
          echo "EVENT: ${{ github.event_name }}"
          echo "COMMENT: ${{ github.event.comment.body }}"

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Configure Git identity
        run: |
          git config --global user.name "OpenCode"
          git config --global user.email "opencode@users.noreply.github.com"

      - name: Find OpenCode configuration
        run: |
          echo "=== OpenCode config files ==="

          find . -maxdepth 5 \
            \( -name "opencode.json" -o -name "opencode.jsonc" \) \
            -print

          echo ""
          echo "=== Search for Anthropic models ==="

          grep -R "anthropic/" . \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=.github \
            || true

          echo ""
          echo "=== Search for Big Pickle ==="

          grep -R "big-pickle" . \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=.github \
            || true

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        with:
          model: opencode/big-pickle
          prompt: ${{ github.event_name == 'workflow_dispatch' && inputs.prompt || github.event.comment.body }}
          use_github_token: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
